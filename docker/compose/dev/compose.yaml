name: geo-registry-amp

services:
  app:
    image: "${APP_IMAGE:-geo-registry-amp-app}"
    build:
      context: ../../..
      dockerfile: docker/php/Dockerfile
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    command: ["bin/app"]
    environment:
      APP_LISTEN: "${APP_LISTEN:-0.0.0.0:8080}"
      APP_NAME: "${APP_NAME:-geo-registry}"
      APP_USER_AGENT: "${APP_USER_AGENT:-geo-registry/0.1}"
      DATAMOS_ADDRESS_REGISTRY_SOURCE: "${DATAMOS_ADDRESS_REGISTRY_SOURCE:-/data/datamos/addressreestr.bson.gz}"
      COMPOSER_HOME: /tmp/composer
      DATABASE_DSN: "${DATABASE_DSN:-host=postgres port=5432 user=app password=local-app-only db=app application_name=geo-registry}"
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-10}"
      HTTP_TIMEOUT_SECONDS: "${HTTP_TIMEOUT_SECONDS:-10}"
      LOG_FORMAT: "${LOG_FORMAT:-console}"
      NOMINATIM_ENABLED: "${NOMINATIM_ENABLED:-1}"
      NOMINATIM_LANGUAGE: "${NOMINATIM_LANGUAGE:-ru}"
      NOMINATIM_URL: "${NOMINATIM_URL:-http://nominatim:8080}"
      MOSCOW_REGION_CODE: "${MOSCOW_REGION_CODE:-77}"
      OSM_ADDRESS_ALIASES_SOURCE: "${OSM_ADDRESS_ALIASES_SOURCE:-/data/geodata/moscow-address-aliases.jsonl}"
      OPENSEARCH_ENABLED: "${OPENSEARCH_ENABLED:-1}"
      OPENSEARCH_INDEX: "${OPENSEARCH_INDEX:-places}"
      OPENSEARCH_SEARCH_ENABLED: "${OPENSEARCH_SEARCH_ENABLED:-0}"
      OPENSEARCH_COORDINATE_UPDATES_ENABLED: "${OPENSEARCH_COORDINATE_UPDATES_ENABLED:-0}"
      OPENSEARCH_PASSWORD: "${OPENSEARCH_PASSWORD:-}"
      OPENSEARCH_URL: "${OPENSEARCH_URL:-http://opensearch:9200}"
      OPENSEARCH_USERNAME: "${OPENSEARCH_USERNAME:-}"
      OPENSEARCH_TIMEOUT_SECONDS: "${OPENSEARCH_TIMEOUT_SECONDS:-60}"
      OPENSEARCH_NUMBER_OF_SHARDS: "${OPENSEARCH_NUMBER_OF_SHARDS:-1}"
      OPENSEARCH_NUMBER_OF_REPLICAS: "${OPENSEARCH_NUMBER_OF_REPLICAS:-0}"
      OPENSEARCH_BULK_NUMBER_OF_REPLICAS: "${OPENSEARCH_BULK_NUMBER_OF_REPLICAS:-0}"
      OPENSEARCH_REFRESH_INTERVAL: "${OPENSEARCH_REFRESH_INTERVAL:-1s}"
      OPENSEARCH_BULK_REFRESH_INTERVAL: "${OPENSEARCH_BULK_REFRESH_INTERVAL:--1}"
      OPENSEARCH_REINDEX_MEMORY_LIMIT: "${OPENSEARCH_REINDEX_MEMORY_LIMIT:-512M}"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ../../../app:/app
      - ../../../docs:/docs:ro
      - "${ADDRESS_SOURCE_DATA_PATH:-../../../docker/data}:/data:ro"
      - ../../../../library/MessageBusAsync:/library/MessageBusAsync:ro
      - ../../../../library/MessageBusAsyncWorker:/library/MessageBusAsyncWorker:ro
    depends_on:
      - nominatim
      - opensearch
      - postgres
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker-address:
    profiles: [worker]
    image: "${APP_IMAGE:-geo-registry-amp-app}"
    build:
      context: ../../..
      dockerfile: docker/php/Dockerfile
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    command:
      - bin/app
      - worker:run
      - --transport=postgres
      - --queue=address
      - --flow=address_async
      - --worker-id=geo-registry-address
      - --worker-name=geo-registry-address
      - --worker-group=geo-registry
    environment:
      APP_NAME: "${APP_NAME:-geo-registry}"
      COMPOSER_HOME: /tmp/composer
      DATABASE_DSN: "${DATABASE_DSN:-host=postgres port=5432 user=app password=local-app-only db=app application_name=geo-registry-worker-address}"
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-10}"
      LOG_FORMAT: "${LOG_FORMAT:-console}"
    volumes:
      - ../../../app:/app
      - ../../../../library/MessageBusAsync:/library/MessageBusAsync:ro
      - ../../../../library/MessageBusAsyncWorker:/library/MessageBusAsyncWorker:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s

  worker-runtime:
    profiles: [worker]
    image: "${APP_IMAGE:-geo-registry-amp-app}"
    build:
      context: ../../..
      dockerfile: docker/php/Dockerfile
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    command:
      - bin/app
      - worker:run
      - --transport=postgres
      - --queue=runtime
      - --flow=runtime_async
      - --worker-id=geo-registry-runtime
      - --worker-name=geo-registry-runtime
      - --worker-group=geo-registry
    environment:
      APP_NAME: "${APP_NAME:-geo-registry}"
      COMPOSER_HOME: /tmp/composer
      DATABASE_DSN: "${DATABASE_DSN:-host=postgres port=5432 user=app password=local-app-only db=app application_name=geo-registry-worker-runtime}"
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-10}"
      LOG_FORMAT: "${LOG_FORMAT:-console}"
      OPENSEARCH_ENABLED: "${OPENSEARCH_ENABLED:-1}"
      OPENSEARCH_COORDINATE_UPDATES_ENABLED: "${OPENSEARCH_COORDINATE_UPDATES_ENABLED:-0}"
      OPENSEARCH_INDEX: "${OPENSEARCH_INDEX:-places}"
      OPENSEARCH_PASSWORD: "${OPENSEARCH_PASSWORD:-}"
      OPENSEARCH_URL: "${OPENSEARCH_URL:-http://opensearch:9200}"
      OPENSEARCH_USERNAME: "${OPENSEARCH_USERNAME:-}"
      OPENSEARCH_TIMEOUT_SECONDS: "${OPENSEARCH_TIMEOUT_SECONDS:-60}"
    volumes:
      - ../../../app:/app
      - ../../../../library/MessageBusAsync:/library/MessageBusAsync:ro
      - ../../../../library/MessageBusAsyncWorker:/library/MessageBusAsyncWorker:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s

  postgres:
    image: ghcr.io/cargosense/postgis:17-3.6-alpine@sha256:03374f4feb0267d755a9d81cc834f8a129f9a99734dd0a029f0bceb3f5689361
    command:
      - postgres
      - -c
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-50}"
      - -c
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}"
      - -c
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - -c
      - "work_mem=${POSTGRES_WORK_MEM:-8MB}"
      - -c
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}"
      - -c
      - "autovacuum_work_mem=${POSTGRES_AUTOVACUUM_WORK_MEM:-128MB}"
      - -c
      - "autovacuum_max_workers=${POSTGRES_AUTOVACUUM_MAX_WORKERS:-3}"
      - -c
      - "wal_buffers=${POSTGRES_WAL_BUFFERS:-16MB}"
      - -c
      - "min_wal_size=${POSTGRES_MIN_WAL_SIZE:-1GB}"
      - -c
      - "max_wal_size=${POSTGRES_MAX_WAL_SIZE:-4GB}"
      - -c
      - "wal_compression=${POSTGRES_WAL_COMPRESSION:-on}"
      - -c
      - "checkpoint_timeout=${POSTGRES_CHECKPOINT_TIMEOUT:-15min}"
      - -c
      - "checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}"
      - -c
      - "checkpoint_warning=${POSTGRES_CHECKPOINT_WARNING:-2min}"
      - -c
      - "max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES:-8}"
      - -c
      - "max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-2}"
      - -c
      - "max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-2}"
      - -c
      - "max_parallel_maintenance_workers=${POSTGRES_MAX_PARALLEL_MAINTENANCE_WORKERS:-2}"
      - -c
      - "effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-32}"
      - -c
      - "maintenance_io_concurrency=${POSTGRES_MAINTENANCE_IO_CONCURRENCY:-16}"
      - -c
      - "huge_pages=${POSTGRES_HUGE_PAGES:-try}"
      - -c
      - "track_io_timing=${POSTGRES_TRACK_IO_TIMING:-on}"
      - -c
      - "track_wal_io_timing=${POSTGRES_TRACK_WAL_IO_TIMING:-on}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-app-only}"
      POSTGRES_USER: "${POSTGRES_USER:-app}"
    shm_size: "${POSTGRES_SHM_SIZE:-512mb}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}"
      discovery.type: single-node
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  nominatim:
    image: mediagis/nominatim:5.3
    shm_size: 1gb
    environment:
      IMPORT_STYLE: "${NOMINATIM_IMPORT_STYLE:-address}"
      NOMINATIM_PASSWORD: "${NOMINATIM_PASSWORD:-local-nominatim-only}"
      PBF_PATH: "${NOMINATIM_PBF_PATH:-}"
      PBF_URL: "${NOMINATIM_PBF_URL-https://download.geofabrik.de/europe/monaco-latest.osm.pbf}"
      POSTGRES_AUTOVACUUM_WORK_MEM: 128MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_MAINTENANCE_WORK_MEM: 512MB
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_WORK_MEM: 16MB
      REPLICATION_URL: "${NOMINATIM_REPLICATION_URL-https://download.geofabrik.de/europe/monaco-updates/}"
      THREADS: "${NOMINATIM_THREADS:-2}"
      UPDATE_MODE: "${NOMINATIM_UPDATE_MODE:-none}"
    ports:
      - "${NOMINATIM_PORT:-8081}:8080"
    volumes:
      - "${NOMINATIM_DATA_PATH:-../../../docker/data/nominatim}:/data/nominatim:ro"
      - nominatim-data:/var/lib/postgresql/16/main
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/status"]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 30s

volumes:
  nominatim-data:
  opensearch-data:
  postgres-data:
