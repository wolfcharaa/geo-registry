name: geo-registry-integration

services:
  postgres:
    image: postgres:17-alpine
    profiles: [integration]
    environment:
      POSTGRES_DB: integration
      POSTGRES_PASSWORD: integration-only
      POSTGRES_USER: integration
    ports:
      - "127.0.0.1:${INTEGRATION_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d integration"]
      interval: 2s
      timeout: 3s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    profiles: [integration]
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "${INTEGRATION_OPENSEARCH_JAVA_OPTS:--Xms256m -Xmx256m}"
      discovery.type: single-node
    ports:
      - "127.0.0.1:${INTEGRATION_OPENSEARCH_PORT:-59200}:9200"
    tmpfs:
      - /usr/share/opensearch/data:uid=1000,gid=1000,mode=0770
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
